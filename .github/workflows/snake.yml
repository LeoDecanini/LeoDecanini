name: Víbora de contribuciones

on:
  # se regenera todos los días
  schedule:
    - cron: "0 6 * * *"
  # permite correrlo a mano desde la pestaña Actions
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generar la víbora con los colores de MoveUp
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#fe0053&color_dots=#ebedf0,#b3d4fb,#66a9f4,#2b88f0,#006fed
            dist/snake-dark.svg?color_snake=#fe0053&color_dots=#161b22,#0b2a55,#00449a,#0059c4,#006fed

      - name: Subir los archivos a la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
